name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Triggers for the integration job below, which is skipped on push and pull_request.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21']
        include:
          # macOS hides the Linux-only permission problem DockerSandboxRunner works around, so the
          # two platforms fail in different ways and only one of them is otherwise covered.
          - os: macos-latest
            java: '21'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Unit tests are fully offline — no API keys required.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Javadoc and sources are only built under -Prelease, so without this they break during a
      # release rather than on the pull request that broke them. Signing needs a key, hence -Dgpg.skip.
      - name: Build the release artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./mvnw -B -ntp -Prelease verify -DskipTests -Dgpg.skip=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # End-to-end tests against a real model. Not on every push: they cost money and need a secret.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./mvnw -B -ntp -Pit verify
